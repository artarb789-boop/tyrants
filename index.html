<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тираны Подземья</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="setup" class="screen">
  <div class="setupBox">
    <h1>Тираны Подземья</h1>
    <p class="sub">Цифровая версия по PnP · 2–4 игрока, люди и боты на одном устройстве</p>
    <div id="setupBody"></div>
  </div>
</div>

<div id="game" class="hidden">
  <div id="boardWrap"><div id="board"><svg id="svg" viewBox="0 0 2000 2000"></svg></div>
    <div id="zoomCtl"><button id="zIn" title="Приблизить (колесо мыши)">＋</button><button id="zOut" title="Отдалить">－</button><button id="zReset" title="Показать всё поле и вернуть поворот">⤢</button><button id="rL" title="Вращать против часовой (зажмите; клавиша Q или правая кнопка мыши)">⟲</button><button id="rR" title="Вращать по часовой (зажмите; клавиша E или правая кнопка мыши)">⟳</button></div></div>
  <div id="side">
    <div class="topbar"><span id="turnTitle"></span><span class="sp"></span><span class="tabs"><button id="tabGame" class="tab on">Игра</button><button id="tabLog" class="tab">Журнал <b id="logNew"></b></button></span><button id="bRules" class="mini">Правила</button><button id="bMenu" class="mini">Меню</button></div>
    <div id="paneGame" class="pane">
    <div id="players"></div>
    <div class="box"><div class="hdr">Рынок <span id="mdeckCount" class="dim"></span></div><div id="market"></div><div id="supply"></div></div>
    <div class="box turn">
      <div id="prompt"></div>
      <div class="poolRow">
        <span class="res pow" title="Сила"><i class="ic pow"></i> <b id="powN">0</b></span>
        <span class="res inf" title="Влияние"><i class="ic inf"></i> <b id="infN">0</b></span>
        <button id="bDeploy" title="Отправить отряд за 1 силу (подряд, пока хватает силы)">Отряд <small>1<i class="ic pow"></i></small></button>
        <button id="bKill" title="Уничтожить вражеский отряд за 3 силы">Убить <small>3<i class="ic pow"></i></small></button>
        <button id="bSpy" title="Выслать вражеского шпиона за 3 силы">Выслать <small>3<i class="ic pow"></i></small></button>
        <span id="gems"></span>
        <span class="turnBtns"><button id="bAll" title="Сыграть простые карты: Знать, Солдат, Жрица Ллот, Страж Дома">Простые карты</button><button id="bEnd" class="endBtn">Завершить ход</button></span>
      </div>
      <div class="hdr">Сыграно</div><div id="played"></div>
      <div class="hdr"><span id="handTitle">Рука</span></div>
      <div id="hand"></div>
    </div>
    </div>
    <div id="paneLog" class="pane hidden"><div class="box logBox"><div class="hdr">Журнал партии</div><div id="log"></div></div></div>
  </div>
</div>

<div id="modal" class="hidden"></div>
<div id="zoom" class="hidden"><img alt=""></div>
<div id="flash"></div>

<script src="js/data_cards.js"></script>
<script src="js/data_cards_fan.js"></script>
<script src="js/data_board.js"></script>
<script src="js/data_web.js"></script>
<script src="js/engine.js"></script>
<script src="js/effects.js"></script>
<script src="js/effects_fan.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
